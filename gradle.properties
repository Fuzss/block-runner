org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
loom.ignoreDependencyLoomVersionValidation=true

# Mod Attributes
modId=blockrunner
modName=Block Runner
modVersion=21.1.2
modAuthor=Fuzs
modDescription=Encourages path building by making you run faster on certain blocks such as path blocks.
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/blockrunner
modIssueUrl=https://github.com/Fuzss/blockrunner/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/blockrunner.json
modMavenGroup=fuzs.blockrunner
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=IGNORE_SERVER_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=*

# Version Catalog
dependenciesVersionCatalog=1.21.1-SNAPSHOT
#dependenciesPuzzlesLibVersion=21.0.25
#dependenciesMinPuzzlesLibVersion=21.0.25

# Mod Publishing
projectReleaseType=release
